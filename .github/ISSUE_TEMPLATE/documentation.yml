name: Documentation improvement

description: Report unclear, incomplete, or outdated documentation.
title: "[Docs] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to **Shodan Dorks for Advanced OSINT**.

        Project owner and primary maintainer: **h4ckd4d**.

  - type: input
    id: location
    attributes:
      label: File or section
      placeholder: "README.md / Core filter families"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What should be improved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I am not including credentials, private keys, personal data, or sensitive third-party system details.
          required: true
